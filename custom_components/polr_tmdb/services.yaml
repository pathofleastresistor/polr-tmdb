add_to_watchlist:
  name: Add to Watchlist
  description: Add a movie or TV show to the watchlist by TMDB ID.
  fields:
    tmdb_id:
      name: TMDB ID
      description: The numeric TMDB ID of the movie or show.
      required: true
      example: 1396
      selector:
        number:
          min: 1
          mode: box
    media_type:
      name: Media Type
      description: Whether this is a movie or TV show.
      required: true
      example: tv
      selector:
        select:
          options:
            - movie
            - tv
    status:
      name: Status
      description: Initial watch status (defaults to want_to_watch).
      required: false
      example: want_to_watch
      selector:
        select:
          options:
            - want_to_watch
            - watching
            - watched
            - paused
            - suggested
            - dismissed

remove_from_watchlist:
  name: Remove from Watchlist
  description: Remove an item from the watchlist by its internal item_id.
  fields:
    item_id:
      name: Item ID
      description: The internal UUID of the watchlist item (available as sensor attribute).
      required: true
      example: "abc123"
      selector:
        text:

update_status:
  name: Update Watch Status
  description: Change the watch status of a watchlist item.
  fields:
    item_id:
      name: Item ID
      description: The internal UUID of the watchlist item.
      required: true
      selector:
        text:
    status:
      name: Status
      description: New watch status.
      required: true
      selector:
        select:
          options:
            - want_to_watch
            - watching
            - watched
            - paused
            - suggested
            - dismissed

update_progress:
  name: Update TV Progress
  description: Update the current season and episode for a TV show.
  fields:
    item_id:
      name: Item ID
      description: The internal UUID of the watchlist item.
      required: true
      selector:
        text:
    season:
      name: Season
      description: Current season number.
      required: false
      selector:
        number:
          min: 1
          mode: box
    episode:
      name: Episode
      description: Current episode number.
      required: false
      selector:
        number:
          min: 1
          mode: box

update_rating:
  name: Update Personal Rating
  description: Set a personal 1-10 rating for a watchlist item.
  fields:
    item_id:
      name: Item ID
      description: The internal UUID of the watchlist item.
      required: true
      selector:
        text:
    rating:
      name: Rating
      description: Personal rating from 1 to 10.
      required: true
      selector:
        number:
          min: 1
          max: 10
          mode: slider

search:
  name: Search
  description: >-
    Search TMDB for movies and TV shows by title. Returns the matches with
    their TMDB ID, and for titles already on the list, the item_id and
    status. Pass the TMDB ID to add_to_watchlist or suggest.
  fields:
    query:
      name: Query
      description: Title (or part of one) to look for.
      required: true
      example: Shrinking
      selector:
        text:
    media_type:
      name: Media Type
      description: Limit to movies or TV shows. Searches both when left out.
      required: false
      example: tv
      selector:
        select:
          options:
            - movie
            - tv
    limit:
      name: Limit
      description: Maximum number of results (defaults to 10).
      required: false
      example: 5
      selector:
        number:
          min: 1
          max: 40
          mode: box

suggest:
  name: Suggest
  description: >-
    Propose a movie or show to the household with a reason. Adds it with
    status "suggested", or refreshes the reason if it's already suggested.
    Titles already on the list or dismissed are left alone, so this is safe
    to call repeatedly.
  fields:
    tmdb_id:
      name: TMDB ID
      description: The numeric TMDB ID of the movie or show.
      required: true
      example: 136311
      selector:
        number:
          min: 1
          mode: box
    media_type:
      name: Media Type
      description: Whether this is a movie or TV show.
      required: true
      example: tv
      selector:
        select:
          options:
            - movie
            - tv
    reason:
      name: Reason
      description: One or two sentences on why it fits.
      required: true
      example: Warm ensemble comedy from the Ted Lasso team.
      selector:
        text:
          multiline: true
    source:
      name: Source
      description: Who or what made the suggestion.
      required: false
      example: Weekly suggester
      selector:
        text:
    watch_link_url:
      name: Watch link URL
      description: https link that opens the title in its streaming app on a Google TV.
      required: false
      example: https://tv.apple.com/us/show/shrinking/umc.cmc.apzybj6eqf6pzccd97kev7bs
      selector:
        text:
          type: url
    watch_link_service:
      name: Watch link service
      description: Streaming service the link opens in.
      required: false
      example: Apple TV
      selector:
        text:

dismiss:
  name: Dismiss
  description: Pass on a title, remembering why so it isn't suggested again.
  fields:
    item_id:
      name: Item ID
      description: The internal UUID of the watchlist item.
      required: true
      selector:
        text:
    reason:
      name: Reason
      description: Why it isn't for you (too stressful, too slow, dated...).
      required: false
      example: Too stressful
      selector:
        text:

set_watch_link:
  name: Set Watch Link
  description: Store the link that opens this title in its streaming app on a Google TV.
  fields:
    item_id:
      name: Item ID
      description: The internal UUID of the watchlist item.
      required: true
      selector:
        text:
    url:
      name: URL
      description: https link to the title (empty clears it).
      required: true
      example: https://play.hbomax.com/show/e6e7bad9-d48d-4434-b334-7c651ffc4bdf
      selector:
        text:
          type: url
    service:
      name: Service
      description: Streaming service the link opens in.
      required: false
      example: HBO Max
      selector:
        text:

open_on_tv:
  name: Open on TV
  description: >-
    Open a title's watch link on an Android TV / Google TV (Android TV Remote
    media player). Turns the TV on first if needed.
  fields:
    item_id:
      name: Item ID
      description: The internal UUID of the watchlist item.
      required: true
      selector:
        text:
    entity_id:
      name: TV
      description: Android TV Remote media player to open it on.
      required: true
      selector:
        entity:
          domain: media_player
